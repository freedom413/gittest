name: Arthur Lite NSS - JDCloud RE-SS-01

on:
  push:
    branches:
      - build/arthur-lite-nss
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build RE-SS-01 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/local/.ghcup /usr/share/swift
          sudo apt-get clean
          df -h

      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar file flex gawk gettext \
            gcc-multilib g++-multilib git gperf haveged help2man intltool jq libc6-dev-i386 \
            libelf-dev libglib2.0-dev libgmp-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libreadline-dev libfuse-dev libssl-dev libtool \
            lrzsz genisoimage msmtp nano ninja-build p7zip-full patch pkgconf python3 \
            python3-pip python3-dev libpython3-dev qemu-utils rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev \
            zstd xz-utils zip

      - name: Fetch pinned LibWrt source
        shell: bash
        run: |
          set -euxo pipefail
          git init openwrt
          git -C openwrt remote add origin https://github.com/laipeng668/LibWrt.git
          git -C openwrt fetch --depth 1 origin 96a0ec8a427909c4d9ef112641b36bcc0728fa43
          git -C openwrt checkout --detach FETCH_HEAD
          test "$(git -C openwrt rev-parse HEAD)" = "96a0ec8a427909c4d9ef112641b36bcc0728fa43"
          git -C openwrt log -1 --oneline

      - name: Fetch and pin package feeds
        shell: bash
        run: |
          set -euxo pipefail
          cd openwrt
          ./scripts/feeds update -a

          pin_feed() {
            local feed="$1"
            local commit="$2"
            git -C "feeds/$feed" fetch --depth 1 origin "$commit"
            git -C "feeds/$feed" checkout --detach "$commit"
          }

          pin_feed nss_packages c425674d8feab34a3dc8045f9f4f4890d8fb6ca9
          pin_feed packages 2dba1dd2af3b447faf52f85c0850a6f9667cac17
          pin_feed luci c84adb975e207ae8b14982191838ec6218d632cd
          pin_feed routing 48c808034414a2112cf9d5261a20a320e8d0d170
          pin_feed telephony c58ec5a6703966dcccb53d0919698c8aba3a9ef5
          pin_feed video 094bf58da6682f895255a35a84349a79dab4bf95

          ./scripts/feeds install -a

          {
            echo "LibWrt: laipeng668/LibWrt"
            echo "LibWrt commit: 96a0ec8a427909c4d9ef112641b36bcc0728fa43"
            echo "NSS feed: c425674d8feab34a3dc8045f9f4f4890d8fb6ca9"
            echo "ImmortalWrt packages feed: 2dba1dd2af3b447faf52f85c0850a6f9667cac17"
            echo "ImmortalWrt LuCI feed: c84adb975e207ae8b14982191838ec6218d632cd"
            echo "OpenWrt routing feed: 48c808034414a2112cf9d5261a20a320e8d0d170"
            echo "OpenWrt telephony feed: c58ec5a6703966dcccb53d0919698c8aba3a9ef5"
            echo "OpenWrt video feed: 094bf58da6682f895255a35a84349a79dab4bf95"
          } > source-pins.txt

      - name: Apply Arthur defaults and configure
        shell: bash
        run: |
          set -euxo pipefail
          cd openwrt
          cp "$GITHUB_WORKSPACE/configs/Arthur-Lite.config" .config

          # Keep the management address consistent with the user's current router LAN.
          sed -i 's/192\.168\.1\.1/192.168.2.1/g' package/base-files/files/bin/config_generate
          sed -i "s/hostname='.*'/hostname='Arthur-Lite-NSS'/g" package/base-files/files/bin/config_generate

          make defconfig

          required=(
            CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01
            CONFIG_PACKAGE_luci
            CONFIG_PACKAGE_luci-app-homeproxy
            CONFIG_PACKAGE_sing-box
            CONFIG_PACKAGE_kmod-qca-nss-drv
            CONFIG_PACKAGE_kmod-qca-nss-ecm
            CONFIG_NSS_DRV_WIFIOFFLOAD_ENABLE
          )
          for symbol in "${required[@]}"; do
            if ! grep -qx "${symbol}=y" .config; then
              echo "Required Kconfig symbol missing after defconfig: ${symbol}" >&2
              exit 1
            fi
          done

          grep -E '^(CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01|CONFIG_ATH11K_MEM_PROFILE_512M|CONFIG_NSS_FIRMWARE_VERSION_11_4|CONFIG_NSS_DRV_|CONFIG_PACKAGE_(luci-app-homeproxy|sing-box|kmod-qca-nss))' .config | sort

      - name: Download source packages
        shell: bash
        run: |
          set -euxo pipefail
          cd openwrt
          make download -j"$(nproc)"

      - name: Compile firmware
        shell: bash
        run: |
          set -euxo pipefail
          cd openwrt
          make -j"$(nproc)" || make -j1 V=s

      - name: Verify images and collect deliverables
        shell: bash
        run: |
          set -euxo pipefail
          cd openwrt

          target="bin/targets/qualcommax/ipq60xx"
          sysupgrade="$(find "$target" -maxdepth 1 -type f -name '*jdcloud_re-ss-01*squashfs-sysupgrade.bin' -print -quit)"
          factory="$(find "$target" -maxdepth 1 -type f -name '*jdcloud_re-ss-01*squashfs-factory.bin' -print -quit)"
          manifest="$(find "$target" -maxdepth 1 -type f -name '*qualcommax-ipq60xx.manifest' -print -quit)"

          test -n "$sysupgrade"
          test -n "$factory"
          test -n "$manifest"
          test -s "$sysupgrade"
          test -s "$factory"

          for package in luci-app-homeproxy sing-box kmod-qca-nss-drv kmod-qca-nss-ecm; do
            grep -q "^$package " "$manifest" || {
              echo "Required package missing from manifest: $package" >&2
              exit 1
            }
          done

          python3 - "$sysupgrade" <<'PY'
          import sys, tarfile
          image = sys.argv[1]
          with tarfile.open(image, "r:*") as archive:
              members = archive.getmembers()
              kernels = [m for m in members if m.name.split("/")[-1] in ("kernel", "kernel.bin", "kernel.img")]
              if not kernels:
                  raise SystemExit("Could not find kernel payload in sysupgrade archive")
              kernel = max(kernels, key=lambda m: m.size)
              print(f"sysupgrade kernel payload: {kernel.size} bytes")
              if kernel.size > 6 * 1024 * 1024:
                  raise SystemExit("Kernel exceeds this device's 6 MiB HLOS partition")
          PY

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$sysupgrade" "$GITHUB_WORKSPACE/artifacts/"
          cp "$factory" "$GITHUB_WORKSPACE/artifacts/"
          cp "$manifest" "$GITHUB_WORKSPACE/artifacts/"
          cp .config "$GITHUB_WORKSPACE/artifacts/Arthur-Lite.config.final"
          cp config.buildinfo "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/source-pins.txt" "$GITHUB_WORKSPACE/artifacts/"
          {
            echo "Device: JDCloud RE-SS-01 / IPQ6018"
            echo "RAM profile: 512 MiB"
            echo "Kernel target: Linux 6.12"
            echo "HLOS kernel partition: 6 MiB"
            echo "NSS firmware: 11.4 (Wi-Fi offload enabled)"
            echo "LuCI: enabled, Simplified Chinese"
            echo "Proxy: HomeProxy + sing-box"
            echo "LAN address: 192.168.2.1"
            echo "Source commit: 96a0ec8a427909c4d9ef112641b36bcc0728fa43"
          } > "$GITHUB_WORKSPACE/artifacts/BUILDINFO.txt"
          (
            cd "$GITHUB_WORKSPACE/artifacts"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arthur-Lite-NSS-RE-SS-01-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          tag="arthur-lite-nss-${GITHUB_RUN_ID}"
          gh release create "$tag" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Arthur Lite NSS - RE-SS-01 #${GITHUB_RUN_NUMBER}" \
            --notes "Custom LibWrt firmware for JDCloud RE-SS-01 (IPQ6018, 512 MiB). Includes NSS 11.4 Wi-Fi offload, LuCI Simplified Chinese, HomeProxy and sing-box. Kernel partition target: 6 MiB. Review SHA256SUMS and BUILDINFO.txt before flashing. Built from pinned source and feed commits."
